<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src blob:; connect-src 'none'; form-action 'none'; base-uri 'none'; object-src 'none'; require-trusted-types-for 'script'">
<meta name="referrer" content="no-referrer">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#fbf8f1" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1b1a17" media="(prefers-color-scheme: dark)">
<meta name="description" content="A pet-sitting guide that lives inside one link. No accounts, no uploads.">
<title>Pet List</title>
<style>
:root{
  --paper:#fbf8f1;--card:#fffdf8;--sunk:#f4efe3;--ink:#1d1b18;--muted:#6f6a60;--faint:#9a9488;--line:#e3ddcf;--rule:#ece5d6;
  --accent:#c9502a;--accent-soft:#f7e3d9;--ok:#2f7d4f;--warn:#b07a0e;--bad:#c23b2b;--bad-soft:#f8e1dd;
  --sketch-paper:#fffdf7;--shadow:0 1px 0 rgba(60,45,20,.06),0 6px 18px -10px rgba(60,45,20,.25);
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,Roboto,sans-serif;
  color-scheme:light}
@media (prefers-color-scheme:dark){:root{
  --paper:#1b1a17;--card:#24221e;--sunk:#2c2a25;--ink:#f1ece2;--muted:#aaa398;--faint:#7d776c;--line:#3a372f;--rule:#2f2c26;
  --accent:#e8774f;--accent-soft:#3d2a21;--bad-soft:#3d2421;--shadow:0 1px 0 rgba(0,0,0,.3),0 8px 20px -12px rgba(0,0,0,.6);color-scheme:dark}}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.5 var(--sans);overflow-x:hidden;-webkit-tap-highlight-color:transparent}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
.wrap{max-width:640px;margin:0 auto;padding-inline:16px}

/* app bar */
.appbar{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--paper) 92%,transparent);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px)}
.appbar .wrap{display:flex;align-items:center;gap:8px;min-height:52px}
.brand{display:flex;align-items:center;gap:8px;border:0;background:none;padding:6px 4px;font:600 18px/1 var(--serif);letter-spacing:.01em}
.brand svg{width:26px;height:26px;color:var(--accent)}
.appbar .spacer{flex:1}
.appbar .crumb{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:45vw}

main{padding-block:16px 140px}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 16px;border-radius:12px;border:1px solid var(--line);background:var(--card);font-size:15px;font-weight:600;line-height:1.1;text-align:center}
.btn svg{width:20px;height:20px;flex:none}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.dark{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.btn.ghost{background:none;border-color:transparent;color:var(--muted)}
.btn.small{min-height:36px;padding:0 12px;font-size:14px;border-radius:10px}
.btn.danger{color:var(--bad)}
.btn:disabled{opacity:.45;cursor:default}
.icon-btn{display:inline-grid;place-items:center;width:44px;height:44px;border-radius:12px;border:0;background:none;color:var(--muted);padding:0}
.icon-btn svg{width:22px;height:22px}
.icon-btn:disabled{opacity:.3}
.btn:focus-visible,.icon-btn:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* home */
.hero{padding-block:20px 8px}
.hero h1{font:600 34px/1.1 var(--serif);margin:0 0 10px;letter-spacing:-.01em}
.hero p{margin:0 0 18px;color:var(--muted);font-size:17px}
.how{list-style:none;padding:0;margin:0 0 22px;display:grid;gap:10px}
.how li{display:flex;gap:12px;align-items:flex-start;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.how b{display:grid;place-items:center;flex:none;width:28px;height:28px;border-radius:99px;background:var(--accent-soft);color:var(--accent);font-size:14px}
.section-title{font:600 13px/1 var(--sans);text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:28px 0 10px}
.guide-list{display:grid;gap:10px}
.guide-row{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:4px 4px 4px 14px;box-shadow:var(--shadow)}
.guide-row button.open{flex:1;min-width:0;text-align:left;border:0;background:none;padding:10px 0;display:grid;gap:2px}
.guide-row .t{font:600 17px/1.25 var(--serif);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.guide-row .s{font-size:13px;color:var(--muted)}

/* guide header (read) */
.g-head,.card,.comment{unicode-bidi:plaintext}
.g-head{padding-block:10px 6px}
.g-head .kicker{font-size:13px;color:var(--muted);margin-bottom:6px}
.g-head h1{font:600 32px/1.12 var(--serif);margin:0 0 10px;letter-spacing:-.01em;overflow-wrap:anywhere}
.g-head .intro{margin:0;font-size:17px;white-space:pre-wrap;overflow-wrap:anywhere;padding:2px 0;
  background-image:repeating-linear-gradient(to bottom,transparent 0,transparent calc(1.5em - 1px),var(--rule) calc(1.5em - 1px),var(--rule) 1.5em);line-height:1.5em}
.toc{display:flex;gap:8px;overflow-x:auto;padding:14px 0 4px;margin:0 -16px;padding-inline:16px;scrollbar-width:none}
.toc::-webkit-scrollbar{display:none}
.toc a{flex:none;text-decoration:none;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:99px;padding:7px 13px;font-size:14px;white-space:nowrap;max-width:60vw;overflow:hidden;text-overflow:ellipsis}

/* cards */
.cards{display:grid;gap:14px;margin-top:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;box-shadow:var(--shadow);min-width:0;scroll-margin-top:70px}
.card h2{font:600 22px/1.2 var(--serif);margin:0 0 10px;overflow-wrap:anywhere}
.card .text{margin:10px 0 0;white-space:pre-wrap;overflow-wrap:anywhere}
.card .text:first-child{margin-top:0}
.empty-note{color:var(--muted);text-align:center;padding:28px 12px;border:2px dashed var(--line);border-radius:18px}

/* sketches: always ink on paper, in both themes */
.sk{display:block;width:100%;height:auto;border-radius:10px;background:var(--sketch-paper);border:1px solid rgba(0,0,0,.08);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.media{margin:4px 0 0;position:relative}
.media button.zoom{display:block;width:100%;border:0;padding:0;background:none;border-radius:10px}
.media>button.zoom>.sk,.media>div>button.zoom>.sk{width:auto;max-width:100%;max-height:min(62vh,520px);margin:0 auto}
.steps{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.steps.one{grid-template-columns:1fr}
.step{margin:0;min-width:0;position:relative}
.step .badge{position:absolute;top:6px;left:6px;min-width:24px;height:24px;padding:0 7px;border-radius:99px;background:var(--accent);color:#fff;font-size:13px;font-weight:700;display:grid;place-items:center;pointer-events:none;z-index:1}
.step figcaption{font-size:14px;line-height:1.35;margin-top:6px;overflow-wrap:anywhere}
.media .label{font-size:12.5px;color:var(--muted);margin-top:6px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.flip-state{position:absolute;right:8px;bottom:8px;background:rgba(29,27,24,.75);color:#fff;font-size:12px;border-radius:99px;padding:3px 9px;pointer-events:none}

/* checklist (read) */
.checks{list-style:none;padding:0;margin:12px 0 0;display:grid;gap:2px}
.checks label{display:flex;gap:12px;align-items:flex-start;padding:9px 4px;cursor:pointer;border-radius:10px;min-height:44px}
.checks input{appearance:none;-webkit-appearance:none;flex:none;width:26px;height:26px;margin:0;border:2px solid var(--muted);border-radius:8px;display:grid;place-items:center;background:var(--card);cursor:pointer}
.checks input::after{content:"";width:12px;height:7px;border:solid #fff;border-width:0 0 3px 3px;transform:rotate(-45deg) translate(1px,-1px);opacity:0}
.checks input:checked{background:var(--ok);border-color:var(--ok)}
.checks input:checked::after{opacity:1}
.checks input:checked + span{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--faint)}
.checks span{padding-top:1px;overflow-wrap:anywhere}
.checks-foot{display:flex;justify-content:space-between;align-items:center;font-size:12.5px;color:var(--muted);margin-top:4px}

/* comments */
.notes{margin-top:26px}
.notes h2{font:600 24px/1.2 var(--serif);margin:0 0 4px}
.notes .sub{color:var(--muted);margin:0 0 12px;font-size:14px}
.comment{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:12px;padding:10px 12px;margin-bottom:10px;display:flex;gap:8px;align-items:flex-start}
.comment .body{flex:1;min-width:0}
.comment .who{font-weight:650;font-size:14.5px}
.comment .when{color:var(--muted);font-size:12.5px;margin-left:6px;font-weight:400}
.comment p{margin:3px 0 0;white-space:pre-wrap;overflow-wrap:anywhere}
.form{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;display:grid;gap:10px}

/* fields */
.field{display:grid;gap:6px}
.field>span{font-size:13px;font-weight:600;color:var(--muted)}
.in{width:100%;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:11px 12px;font-size:16px;line-height:1.4;min-height:46px}
textarea.in{resize:none;min-height:84px;overflow:hidden;display:block}
textarea.in.short{min-height:46px}
.in::placeholder{color:var(--faint)}
.in.title-in{font:600 26px/1.2 var(--serif);border:0;border-bottom:2px solid var(--line);border-radius:0;padding:8px 2px;background:none}
.in.title-in:focus{border-bottom-color:var(--accent);outline:none}
.in.card-title{font:600 19px/1.25 var(--serif);border:0;background:none;padding:8px 2px;min-width:0;flex:1}
.in.card-title:focus{outline:none;box-shadow:inset 0 -2px 0 var(--accent)}

/* edit cards */
.card.edit{padding:10px 12px 14px}
.ehead{display:flex;align-items:center;gap:2px}
.ehead .num{flex:none;width:26px;height:26px;border-radius:99px;background:var(--sunk);color:var(--muted);display:grid;place-items:center;font-size:13px;font-weight:700;margin-right:4px}
.ehead .icon-btn{width:40px;height:44px}
.card.edit textarea.in{margin-top:6px}
.addmedia{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.addmedia .btn{flex-direction:column;gap:4px;min-height:64px;font-size:13.5px;font-weight:600;color:var(--muted);border-style:dashed;background:none;padding:6px}
.addmedia .btn svg{width:24px;height:24px;color:var(--accent)}
.mblock{margin-top:10px;background:var(--sunk);border-radius:14px;padding:10px}
.mtools{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px}
.mtools .grow{flex:1}
.msize{font-size:12.5px;color:var(--muted)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--card)}
.seg button{border:0;background:none;padding:0 12px;min-height:36px;font-size:13.5px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed=true]{background:var(--ink);color:var(--paper)}
.sel{min-height:36px;border:1px solid var(--line);border-radius:10px;background:var(--card);padding:0 8px;font-size:13.5px}
.step-edit .cap{width:100%;margin-top:6px;border:1px solid var(--line);background:var(--card);border-radius:9px;padding:8px 9px;font-size:14px;min-height:40px}
.step-edit .rm{position:absolute;top:0;right:0;width:40px;height:40px;border:0;background:none;display:grid;place-items:center;padding:0;z-index:1}
.step-edit .rm::before{content:"";position:absolute;width:26px;height:26px;border-radius:99px;background:rgba(29,27,24,.72)}
.step-edit .rm svg{width:14px;height:14px;color:#fff;position:relative}
.busy{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;min-height:150px;color:var(--muted);font-size:14px;text-align:center}
.spinner{width:28px;height:28px;border-radius:99px;border:3px solid var(--line);border-top-color:var(--accent);animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.merr{color:var(--bad);font-size:14px;margin-top:8px}
.list-edit{display:grid;gap:6px;margin-top:10px}
.list-edit .row{display:flex;gap:6px;align-items:center}
.list-edit .box{flex:none;width:20px;height:20px;border:2px solid var(--faint);border-radius:6px;margin:0 4px}
.list-edit .in{min-height:42px;padding:8px 10px;font-size:15px}
.list-edit .icon-btn{width:40px;height:42px}
.add-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.add-row .btn{min-height:52px}
.hint{color:var(--muted);font-size:14px;margin:6px 0 0}
.c-edit{display:flex;gap:6px;align-items:flex-start}

/* dock */
.dock{position:fixed;left:0;right:0;bottom:0;z-index:30;background:color-mix(in srgb,var(--paper) 94%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-top:1px solid var(--line);padding:10px 0 calc(10px + env(safe-area-inset-bottom,0px))}
.dock .wrap{display:grid;gap:8px}
.dock .row{display:flex;gap:10px}
.dock .row .btn{flex:1;min-height:50px;font-size:16px}
.meter-row{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.meter{flex:1;height:8px;border-radius:99px;background:var(--line);overflow:hidden}
.meter i{display:block;height:100%;width:0;background:var(--ok);border-radius:99px;transition:width .3s}
.meter-row.warn .meter i{background:var(--warn)}
.meter-row.over .meter i{background:var(--bad)}
.meter-row.over .mtext{color:var(--bad);font-weight:600}
.over-msg{background:var(--bad-soft);color:var(--bad);border-radius:10px;padding:8px 10px;font-size:13.5px;font-weight:600}

/* sheets & overlays */
.scrim{position:fixed;inset:0;z-index:50;background:rgba(20,16,10,.45);display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:640px;background:var(--paper);border-radius:20px 20px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));max-height:94vh;overflow:auto;box-shadow:0 -10px 40px rgba(0,0,0,.25)}
.sheet h3{font:600 22px/1.2 var(--serif);margin:0 0 6px}
.sheet p{margin:0 0 12px;color:var(--muted)}
.sheet .actions{display:grid;gap:10px;margin-top:14px}
.sheet .actions .btn{min-height:50px}
.sheet textarea.link{width:100%;height:96px;font:12px/1.35 ui-monospace,Menlo,monospace;border:1px solid var(--line);border-radius:10px;padding:8px;background:var(--card);word-break:break-all;resize:none}
.draw-sheet{display:flex;flex-direction:column;gap:12px}
.draw-top{display:flex;align-items:center;gap:8px}
.draw-top h3{flex:1;margin:0}
.draw-canvas{width:100%;height:auto;touch-action:none;border-radius:12px;background:var(--sketch-paper);border:1px solid rgba(0,0,0,.12);display:block;cursor:crosshair}
.tools{display:flex;gap:8px;flex-wrap:wrap}
.tools .seg button{min-height:44px;padding:0 14px}
.lightbox{position:fixed;inset:0;z-index:60;background:rgba(15,12,8,.92);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:16px;gap:12px;color:#fff}
.lightbox canvas{max-width:100%;max-height:78vh;width:auto;height:auto;border-radius:10px;background:var(--sketch-paper)}
.lightbox p{margin:0;max-width:600px;text-align:center}
.err-card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:22px 18px;margin-top:20px;box-shadow:var(--shadow)}
.err-card h1{font:600 26px/1.2 var(--serif);margin:0 0 8px}
.err-card p{color:var(--muted);margin:0 0 16px}
.err-card svg{width:56px;height:56px;color:var(--accent);margin-bottom:8px}
#toast{position:fixed;left:50%;bottom:calc(150px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(10px);z-index:70;background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:14px;font-size:14.5px;opacity:0;transition:opacity .2s,transform .2s;pointer-events:none;width:max-content;max-width:calc(100% - 32px);display:flex;gap:14px;align-items:center}
#toast.show{opacity:1;transform:translateX(-50%);pointer-events:auto}
#toast button{border:0;background:none;color:var(--accent);font-weight:700;padding:6px 2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media (min-width:560px){.hero h1{font-size:40px}.g-head h1{font-size:38px}}
</style>
</head>
<body>
<header class="appbar">
  <div class="wrap">
    <button class="brand" id="homeBtn" aria-label="Pet List — your guides">
      <svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><ellipse cx="16" cy="21" rx="6.5" ry="5.5"/><ellipse cx="7.5" cy="13.5" rx="2.6" ry="3.3"/><ellipse cx="13" cy="8.5" rx="2.6" ry="3.4"/><ellipse cx="19.5" cy="8.5" rx="2.6" ry="3.4"/><ellipse cx="25" cy="13.5" rx="2.6" ry="3.3"/></svg>
      Pet List
    </button>
    <span class="spacer"></span>
    <span class="crumb" id="crumb"></span>
  </div>
</header>
<main class="wrap" id="main"></main>
<div class="dock" id="dock" hidden><div class="wrap" id="dockInner"></div></div>
<input type="file" id="filePhoto" accept="image/*" hidden>
<input type="file" id="fileVideo" accept="video/*" hidden>
<div id="toast" role="status" aria-live="polite"></div>
<noscript><p class="wrap">Pet List needs JavaScript to open guides.</p></noscript>
<script src="sketch-core.js"></script>
<script src="petlist.js"></script>
</body>
</html>
