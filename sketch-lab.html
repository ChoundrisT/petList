<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sketch Lab</title>
<style>
:root{--paper:#fbf8f1;--card:#fffdf8;--ink:#1d1b18;--muted:#6f6a60;--line:#e3ddcf;--accent:#d9572b;--ok:#2f7d4f;--warn:#c98a12;--bad:#c23b2b;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--paper:#1b1a17;--card:#24221e;--ink:#f1ece2;--muted:#a39d91;--line:#3a372f;color-scheme:dark}}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif}
.wrap{max-width:1080px;margin:0 auto;padding-inline:16px}
header{padding-block:28px 8px}
h1{font-size:28px;margin:0 0 4px;letter-spacing:-.01em}
header p{margin:0;color:var(--muted)}
.budget{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper);padding-block:12px;border-bottom:1px solid var(--line);display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center}
.meter{flex:1 1 220px;height:10px;border-radius:99px;background:var(--line);overflow:hidden}
.meter i{display:block;height:100%;width:0;background:var(--ok);transition:width .3s}
.budget.warn .meter i{background:var(--warn)}
.budget.over .meter i{background:var(--bad)}
.budget-text{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.budget textarea{flex:1 1 100%;font:12px ui-monospace,monospace;height:70px}
button{font:inherit;font-size:14px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;padding:6px 12px;cursor:pointer}
button.primary{background:var(--ink);color:var(--paper);border-color:var(--ink)}
button:disabled{opacity:.45;cursor:default}
.drop{display:flex;flex-direction:column;align-items:center;gap:2px;border:2px dashed var(--line);border-radius:14px;padding:26px 16px;margin-block:16px;cursor:pointer;text-align:center;background:var(--card)}
.drop span{color:var(--muted);font-size:13px}
.drop.over{border-color:var(--accent)}
.settings{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 16px;margin-bottom:16px}
.settings summary{font-weight:600;cursor:pointer}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px 22px;margin-block:12px 4px}
.ctl label{display:flex;justify-content:space-between;gap:8px;font-size:13px;color:var(--muted)}
.ctl output{color:var(--ink);font-variant-numeric:tabular-nums}
.ctl input[type=range],.ctl select{width:100%}
.ctl.check label{justify-content:flex-start;align-items:center;padding-top:18px}
.group-title{grid-column:1/-1;font-size:11.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin-top:4px}
.items{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,470px),1fr));gap:16px;padding-bottom:48px}
.empty{color:var(--muted);text-align:center;padding:24px 0}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;min-width:0}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.pair.solo{grid-template-columns:1fr}
figure{margin:0;min-width:0}
.frame{position:relative}
figure img,figure video,figure canvas{display:block;width:100%;height:auto;border-radius:8px}
figure img,figure video{background:#000}
figure canvas{background:#fffdf7;border:1px solid rgba(0,0,0,.08)}
.busy{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(255,253,247,.85);color:#555;font-size:13px;border-radius:8px;text-align:center;padding:8px}
.steps{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.step{position:relative}
.step span{position:absolute;top:5px;left:5px;min-width:20px;height:20px;padding:0 5px;border-radius:99px;background:var(--accent);color:#fff;font-size:11.5px;font-weight:700;display:grid;place-items:center}
figcaption{font-size:12.5px;color:var(--muted);margin-top:6px}
figcaption b{color:var(--ink);font-weight:600}
.err{color:var(--bad)}
.meta{display:flex;justify-content:space-between;align-items:center;margin-top:10px;font-size:12.5px;color:var(--muted);gap:8px}
.meta .name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.note{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 16px;margin-block:16px}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:8px 14px;border-radius:99px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;max-width:calc(100% - 32px)}
#toast.show{opacity:1}
</style>
</head>
<body>
<header class="wrap">
  <h1>Sketch Lab</h1>
  <p>Turn photos and videos into line drawings small enough to live inside a link.</p>
</header>

<main class="wrap">
  <section id="received" hidden>
    <div class="note"><span id="receivedText"></span> <button id="backToLab">Back to lab</button></div>
    <div id="receivedItems" class="items"></div>
  </section>

  <section id="lab">
    <div class="budget" id="budget">
      <div class="meter"><i id="meterFill"></i></div>
      <span class="budget-text" id="budgetText">Link: empty</span>
      <button id="copyLink" class="primary" disabled>Copy link</button>
      <button id="openLink" disabled>Open link</button>
      <textarea id="linkOut" readonly hidden aria-label="Link"></textarea>
    </div>

    <label class="drop" id="drop">
      <input type="file" id="file" accept="image/*,video/*" multiple hidden>
      <b>Add photos or videos</b>
      <span>or drop them here</span>
    </label>

    <details class="settings" open>
      <summary>Sketch settings</summary>
      <div class="grid">
        <div class="group-title">Lines</div>
        <div class="ctl"><label for="detail">Detail <output></output></label><input type="range" id="detail" min="1" max="10" value="7"></div>
        <div class="ctl"><label for="lines">Line sensitivity <output></output></label><input type="range" id="lines" min="1" max="100" value="50"></div>
        <div class="ctl"><label for="clean">Remove specks <output></output></label><input type="range" id="clean" min="0" max="40" value="20"></div>
        <div class="ctl"><label for="shade">Shading <output></output></label><input type="range" id="shade" min="0" max="100" value="0"></div>
        <div class="ctl check"><label><input type="checkbox" id="bold" checked> Bold lines (wide sketches)</label></div>
        <div class="ctl"><label for="imgW">Photo size</label><select id="imgW"><option>320</option><option selected>480</option><option>640</option></select></div>
        <div class="group-title">Video</div>
        <div class="ctl"><label for="mode">Turn videos into</label><select id="mode"><option value="steps" selected>Steps (key moments)</option><option value="flip">Flipbook (animation)</option></select></div>
        <div class="ctl"><label for="steps">Max steps <output></output></label><input type="range" id="steps" min="2" max="8" value="4"></div>
        <div class="group-title">Flipbook only</div>
        <div class="ctl"><label for="secs">Seconds of video <output></output></label><input type="range" id="secs" min="1" max="30" value="8"></div>
        <div class="ctl"><label for="vidW">Flipbook size</label><select id="vidW"><option>160</option><option selected>240</option><option>320</option></select></div>
        <div class="ctl"><label for="fps">Frames per second</label><select id="fps"><option>2</option><option selected>3</option><option>4</option><option>6</option><option>8</option></select></div>
        <div class="ctl"><label for="steady">Steady lines <output></output></label><input type="range" id="steady" min="0" max="80" value="50"></div>
        <div class="ctl check"><label><input type="checkbox" id="mc" checked> Cancel camera shake</label></div>
      </div>
    </details>

    <div id="items" class="items"><p class="empty">Add a photo of your pet, a food bowl, a door latch… and a short video.</p></div>
  </section>
</main>
<div id="toast" role="status"></div>

<script>
// CORE START — pure functions, no DOM. Tested in Node.

// ---------- Sketchify ----------
// chroma: saturated pixels count as darker, so a grey/white/blue object on an orange wooden
// floor separates from it even when the brightness is similar. L.cr / L.cb carry the
// brightness-free colour for sketch()'s colour-edge boost.
function lum(data, n, range, chroma = 0.8) {
  const L = new Float32Array(n), cr = new Float32Array(n), cb = new Float32Array(n);
  for (let i = 0, j = 0; i < n; i++, j += 4) {
    const r = data[j], g = data[j + 1], b = data[j + 2], s = r + g + b + 60;
    const mx = r > g ? (r > b ? r : b) : (g > b ? g : b), mn = r < g ? (r < b ? r : b) : (g < b ? g : b);
    L[i] = Math.max(0, 0.299 * r + 0.587 * g + 0.114 * b - chroma * (mx - mn));
    cr[i] = (r - g) / s; cb[i] = (r + g - 2 * b) / s;
  }
  L.cr = cr; L.cb = cb;
  if (!range) {
    const hist = new Uint32Array(256);
    for (let i = 0; i < n; i++) hist[L[i] | 0]++;
    let lo = 0, hi = 255, acc = 0;
    for (; lo < 255; lo++) { acc += hist[lo]; if (acc > n * 0.02) break; }
    acc = 0;
    for (; hi > 0; hi--) { acc += hist[hi]; if (acc > n * 0.02) break; }
    if (hi - lo < 32) { const mid = (lo + hi) / 2; lo = Math.max(0, mid - 64); hi = Math.min(255, mid + 64); } // flat image: don't stretch noise
    range = [lo, hi];
  }
  const lo = range[0], span = range[1] - range[0];
  for (let i = 0; i < n; i++) { const v = (L[i] - lo) / span; L[i] = v < 0 ? 0 : v > 1 ? 1 : v; }
  return { L, range };
}

function blur(src, w, h, sigma) {
  const r = Math.max(1, Math.ceil(sigma * 3)), k = new Float32Array(2 * r + 1);
  let sum = 0;
  for (let i = -r; i <= r; i++) { const v = Math.exp(-(i * i) / (2 * sigma * sigma)); k[i + r] = v; sum += v; }
  for (let i = 0; i < k.length; i++) k[i] /= sum;
  const tmp = new Float32Array(w * h), out = new Float32Array(w * h);
  for (let y = 0; y < h; y++) {
    const row = y * w;
    for (let x = 0; x < w; x++) {
      let a = 0;
      for (let i = -r; i <= r; i++) { let xx = x + i; if (xx < 0) xx = 0; else if (xx >= w) xx = w - 1; a += src[row + xx] * k[i + r]; }
      tmp[row + x] = a;
    }
  }
  for (let y = 0; y < h; y++) {
    for (let x = 0; x < w; x++) {
      let a = 0;
      for (let i = -r; i <= r; i++) { let yy = y + i; if (yy < 0) yy = 0; else if (yy >= h) yy = h - 1; a += tmp[yy * w + x] * k[i + r]; }
      out[y * w + x] = a;
    }
  }
  return out;
}

// Drop connected blobs of ink smaller than `min` pixels (8-connected).
function despeckle(b, w, h, min) {
  if (min <= 1) return;
  const seen = new Uint8Array(w * h), stack = new Int32Array(w * h), list = new Int32Array(w * h);
  for (let s = 0; s < w * h; s++) {
    if (!b[s] || seen[s]) continue;
    let sp = 0, n = 0;
    stack[sp++] = s; seen[s] = 1;
    while (sp) {
      const j = stack[--sp]; list[n++] = j;
      const x = j % w, y = (j / w) | 0;
      for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) {
        const xx = x + dx, yy = y + dy;
        if (xx < 0 || yy < 0 || xx >= w || yy >= h) continue;
        const q = yy * w + xx;
        if (b[q] && !seen[q]) { seen[q] = 1; stack[sp++] = q; }
      }
    }
    if (n < min) for (let k = 0; k < n; k++) b[list[k]] = 0;
  }
}

// Edge-preserving smoothing: flattens fur/petal texture and sensor noise, keeps outlines.
function bilateral(src, w, h, rs, iters) {
  const r = 2, ws = [], LUT = 1024, rw = new Float32Array(LUT + 1);
  for (let dy = -r; dy <= r; dy++) for (let dx = -r; dx <= r; dx++) ws.push(dx, dy, Math.exp(-(dx * dx + dy * dy) / 4.5));
  for (let i = 0; i <= LUT; i++) rw[i] = Math.exp(-(i / LUT) / (2 * rs * rs)); // indexed by dv² (L is 0..1)
  let a = src;
  for (let it = 0; it < iters; it++) {
    const o = new Float32Array(w * h);
    for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
      const c = a[y * w + x];
      let s = 0, sw = 0;
      for (let q = 0; q < ws.length; q += 3) {
        let xx = x + ws[q], yy = y + ws[q + 1];
        xx = xx < 0 ? 0 : xx >= w ? w - 1 : xx; yy = yy < 0 ? 0 : yy >= h ? h - 1 : yy;
        const v = a[yy * w + xx], dv = v - c, wt = ws[q + 2] * rw[(dv * dv * LUT) | 0];
        s += v * wt; sw += wt;
      }
      o[y * w + x] = s / sw;
    }
    a = o;
  }
  return a;
}

// Difference-of-Gaussians line drawing. 1 = ink, 0 = paper.
// prevLines (video) adds hysteresis so lines don't flicker frame to frame.
function sketch(L, w, h, S, prevLines) {
  const CR = L.cr, CB = L.cb;
  if (S.smooth) L = bilateral(L, w, h, S.smooth, S.iters || 2);
  const g1 = blur(L, w, h, S.sigma), g2 = blur(L, w, h, S.sigma * 1.6);
  const n = w * h, lines = new Uint8Array(n), hy = S.steady || 0, d = new Float32Array(n);
  for (let i = 0; i < n; i++) d[i] = g1[i] - g2[i];
  if (S.color && CR) { // boost edges where the colour changes too (object vs floor), not just brightness (plank vs plank)
    const a = blur(CR, w, h, 1.5), b = blur(CB, w, h, 1.5), m = new Float32Array(n), c0 = S.c0 || 0.04;
    for (let y = 1; y < h - 1; y++) for (let x = 1; x < w - 1; x++) {
      const i = y * w + x, ax = a[i + 1] - a[i - 1], ay = a[i + w] - a[i - w], bx = b[i + 1] - b[i - 1], by = b[i + w] - b[i - w];
      m[i] = Math.sqrt(ax * ax + ay * ay + bx * bx + by * by);
    }
    const mb = blur(m, w, h, 1);
    for (let i = 0; i < n; i++) { const k = mb[i] / c0 - 1; if (k > 0) d[i] *= 1 + S.color * (k < 1 ? k : 1); }
  }
  let t = S.t;
  if (S.auto) { // raise the threshold above the image's own noise/texture floor
    const hist = new Uint32Array(1024);
    for (let i = 0; i < n; i++) hist[Math.min(1023, (Math.abs(d[i]) * 4096) | 0)]++;
    let acc = 0, m = 0;
    for (; m < 1023; m++) { acc += hist[m]; if (acc >= n / 2) break; }
    t = Math.max(t, S.auto * m / 4096);
  }
  for (let i = 0; i < n; i++) {
    lines[i] = prevLines
      ? (d[i] < -t * (1 + hy) ? 1 : d[i] > -t * (1 - hy) ? 0 : prevLines[i])
      : (d[i] < -t ? 1 : 0);
  }
  if (S.weak != null && S.weak < 1) { // faint edge pixels join only when touching a strong line
    const stack = new Int32Array(n);
    let sp = 0;
    for (let i = 0; i < n; i++) if (lines[i]) stack[sp++] = i;
    while (sp) {
      const j = stack[--sp], x = j % w, y = (j / w) | 0;
      for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) {
        const xx = x + dx, yy = y + dy;
        if (xx < 0 || yy < 0 || xx >= w || yy >= h) continue;
        const q = yy * w + xx;
        if (!lines[q] && d[q] < -t * S.weak) { lines[q] = 1; stack[sp++] = q; }
      }
    }
  }
  despeckle(lines, w, h, S.clean);
  let out = lines;
  if (S.bold || S.shade > 0) {
    out = new Uint8Array(lines);
    for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
      const i = y * w + x;
      if (out[i]) continue;
      if (S.bold && ((x > 0 && lines[i - 1]) || (y > 0 && lines[i - w]) || (x > 0 && y > 0 && lines[i - w - 1]))) { out[i] = 1; continue; }
      if (S.shade > 0) {
        const l = g1[i];
        if ((l < S.shade && ((x + y) & 3) === 0) || (l < S.shade * 0.5 && ((x - y) & 3) === 0)) out[i] = 1;
      }
    }
  }
  return { lines, out };
}

// ---------- Camera motion ----------
// out(x, y) = f(x - dx, y - dy); pixels shifted in from outside are paper.
function shiftFrame(f, w, h, dx, dy) {
  if (!dx && !dy) return f;
  const o = new Uint8Array(w * h);
  for (let y = 0; y < h; y++) {
    const sy = y - dy;
    if (sy < 0 || sy >= h) continue;
    for (let x = 0; x < w; x++) { const sx = x - dx; if (sx >= 0 && sx < w) o[y * w + x] = f[sy * w + sx]; }
  }
  return o;
}

// Global camera shift between two brightness maps: B(x, y) ≈ A(x - dx, y - dy).
// Coarse search on a sparse grid, then a ±1 refine. cost = mean abs difference after aligning.
function estimateShift(A, B, w, h, R) {
  if (w <= 2 * R + 4 || h <= 2 * R + 4) return { dx: 0, dy: 0, cost: 0 };
  const a = blur(A, w, h, 1.5), b = blur(B, w, h, 1.5);
  const cost = (dx, dy) => {
    let s = 0, n = 0;
    for (let y = R; y < h - R; y += 2) {
      const yb = y * w, ya = (y - dy) * w - dx;
      for (let x = R; x < w - R; x += 2) { s += Math.abs(b[yb + x] - a[ya + x]); n++; }
    }
    return s / n;
  };
  let bx = 0, by = 0, bc = cost(0, 0) * 0.97; // slight bias towards "camera didn't move"
  for (let dy = -R; dy <= R; dy += 2) for (let dx = -R; dx <= R; dx += 2) {
    const c = cost(dx, dy);
    if (c < bc) { bc = c; bx = dx; by = dy; }
  }
  const cx = bx, cy = by;
  for (let dy = cy - 1; dy <= cy + 1; dy++) for (let dx = cx - 1; dx <= cx + 1; dx++) {
    if (Math.abs(dx) > R || Math.abs(dy) > R || (dx === cx && dy === cy)) continue;
    const c = cost(dx, dy);
    if (c < bc) { bc = c; bx = dx; by = dy; }
  }
  return { dx: bx, dy: by, cost: bc };
}

// How crisp a frame is (mean |Laplacian|) — motion blur makes it drop.
function sharpness(L, w, h) {
  let s = 0, n = 0;
  for (let y = 1; y < h - 1; y += 2) for (let x = 1; x < w - 1; x += 2) {
    const i = y * w + x;
    s += Math.abs(4 * L[i] - L[i - 1] - L[i + 1] - L[i - w] - L[i + w]); n++;
  }
  return n ? s / n : 0;
}

// Idea: a guide clip is a tour of a few *places*. For every frame we measure
//  - quality: sharp (no motion blur) and steady (looks like its neighbours), and
//  - a tiny brightness-normalised thumbnail = "what place is this".
// Then we greedily choose frames that *represent* as much well-filmed footage as
// possible (facility location): a pick covers every frame whose thumbnail looks like it.
// Places the user dwells on get a step; revisits of an already covered view add
// nothing, so they never use up a step; blurry walking frames weigh little.
// Stops at K, or earlier when no remaining view is both distinct and substantial.

const STEP_P = { cell: 16, top: 0.1, mix: 0.3, T: 1.1, same: 0.55, place: 0.75, placeGain: 0.025, view: 0.5, viewGain: 0.04, stillScale: 0.2, base: 0.25, open: 0.05, openBoost: 5 };

function stepThumb(L, w, h, g) {
  const sw = Math.max(2, Math.floor(w / g)), sh = Math.max(2, Math.floor(h / g));
  const cw = Math.floor(w / sw), ch = Math.floor(h / sh), o = new Float32Array(sw * sh);
  for (let y = 0; y < sh; y++) for (let x = 0; x < sw; x++) {
    let s = 0;
    for (let yy = y * ch; yy < (y + 1) * ch; yy += 2) { const r = yy * w; for (let xx = x * cw; xx < (x + 1) * cw; xx += 2) s += L[r + xx]; }
    o[y * sw + x] = s;
  }
  let m = 0; for (let i = 0; i < o.length; i++) m += o[i]; m /= o.length;
  let v = 0; for (let i = 0; i < o.length; i++) { o[i] -= m; v += o[i] * o[i]; }
  const sd = Math.sqrt(v / o.length) + 1e-6 + 0.02 * m; // brightness-normalised; flat frames stay flat
  for (let i = 0; i < o.length; i++) o[i] /= sd;
  return o;
}
// Mean cell difference, mixed with the mean of the worst `top` cells so a local change
// (a lid opening in one corner) still counts, not just whole-view changes.
function thumbDist(a, b, top, mix, buf) {
  const m = a.length; let s = 0;
  for (let i = 0; i < m; i++) { const d = a[i] - b[i]; buf[i] = d < 0 ? -d : d; s += buf[i]; }
  const k = Math.max(1, Math.round(m * top)), v = buf.subarray(0, m).sort();
  let t = 0; for (let i = m - k; i < m; i++) t += v[i];
  thumbDist.mean = s / m;
  return (1 - mix) * s / m + mix * t / k;
}

function pickSteps(Ls, w, h, K, P = STEP_P) {
  const n = Ls.length;
  if (n <= 1) return [0];
  K = Math.max(1, K | 0);
  const D = Ls.map(L => stepThumb(L, w, h, P.cell));
  const dist = new Float32Array(n * n), dmean = new Float32Array(n * n), buf = new Float32Array(D[0].length);
  for (let i = 0; i < n; i++) for (let j = i + 1; j < n; j++) {
    dist[i * n + j] = dist[j * n + i] = thumbDist(D[i], D[j], P.top, P.mix, buf);
    dmean[i * n + j] = dmean[j * n + i] = thumbDist.mean;
  }
  const sh = Ls.map(L => sharpness(L, w, h));
  const ref = sh.slice().sort((a, b) => a - b)[Math.floor((n - 1) * 0.9)] || 1;

<script>
const $ = (s, r = document) => r.querySelector(s);
const LINK_BUDGET = 60000; // roughly what a WhatsApp message can carry
const INK = [27, 27, 27], PAPER = [255, 253, 247];
const items = [];

const ctl = Object.fromEntries(['detail', 'lines', 'clean', 'shade', 'bold', 'imgW', 'vidW', 'fps', 'secs', 'steady', 'mode', 'steps', 'mc'].map(id => [id, $('#' + id)]));
function settings() {
  const d = +ctl.detail.value, s = +ctl.lines.value;
  return {
    sigma: 0.5 + (10 - d) * 0.2,
    t: 0.003 + 0.045 * ((100 - s) / 100) ** 2,
    clean: +ctl.clean.value,
    shade: +ctl.shade.value / 100 * 0.6,
    bold: ctl.bold.checked,
    imgW: +ctl.imgW.value, vidW: +ctl.vidW.value, fps: +ctl.fps.value, secs: +ctl.secs.value,
    steady: +ctl.steady.value / 100,
    mode: ctl.mode.value, steps: +ctl.steps.value, mc: ctl.mc.checked,
    smooth: 0.1, weak: 0.45, auto: 2, color: 3,

}

const fmtChars = n => n < 1000 ? `${n}` : `${(n / 1000).toFixed(n < 10000 ? 1 : 0)}K`;
const fmtBytes = n => n < 1e6 ? `${Math.round(n / 1000)} KB` : `${(n / 1e6).toFixed(1)} MB`;
const b64len = n => Math.ceil(n * 4 / 3);
const tick = () => new Promise(r => setTimeout(r));

  const t = $('#toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove('show'), 2600);
}

// so a tall phone video isn't 2× the size of a landscape photo.
const scratch = document.createElement('canvas'); // one canvas reused: iOS frees canvases late and caps their total memory

async function processItem(it, S, my) {

async function processSteps(it, S, my) {

    if (prevL) { const e = estimateShift(prevL, L, w, h, Math.round(w / 16)); shifts.push([e.dx, e.dy]); } else shifts.push([0, 0]);
    prevL = L;
    await tick(); if (my !== gen) return null;
  }
  return { type: 3, w, h, fps: 0, frames, shifts, times };
}

async function zipSize(m) {
  if (typeof CompressionStream === 'undefined') return null;
  const fl = ((m.w + 7) >> 3) * m.h, buf = new Uint8Array(fl * m.frames.length);
  let prev = null;
  m.frames.forEach((f, k) => {
    const p = packBits(f, m.w, m.h);
    if (prev) for (let i = 0; i < fl; i++) buf[k * fl + i] = p[i] ^ prev[i]; else buf.set(p, 0);
    prev = p;
  });
  const ab = await new Response(new Blob([buf]).stream().pipeThrough(new CompressionStream('deflate-raw'))).arrayBuffer();
  return b64len(ab.byteLength);
}

let rerenderTimer;
function scheduleRerender() { clearTimeout(rerenderTimer); rerenderTimer = setTimeout(rerender, 250); }

async function rerender() {
  const my = ++gen;
  for (const it of [...items]) { // snapshot: removing a card mid-loop must not skip the next one
    if (my !== gen) return;
    if (!items.includes(it)) continue;
    setBusy(it, 'Sketching…');
    await tick();
    try { it.err = null; await processItem(it, settings(), my); }
    catch (e) { it.err = e.message; it.bytes = null; }
    if (my !== gen) return;
    setBusy(it, null);
    renderSketch(it);
    updateBudget();
  }
}

// ---------- Rendering ----------
function makeCard(it, received) {
  const list = received ? $('#receivedItems') : $('#items');
  $('.empty', list)?.remove();
  const el = document.createElement('article');
  el.className = 'card';
  const pair = document.createElement('div');
  pair.className = 'pair' + (received ? ' solo' : '');
  if (!received) {
    const fig = document.createElement('figure');
    const media = document.createElement(it.kind === 'video' ? 'video' : 'img');
    media.src = it.url;
    if (it.kind === 'video') Object.assign(media, { muted: true, loop: true, autoplay: true, playsInline: true, controls: true });
    else media.alt = 'Original';
    const cap = document.createElement('figcaption');
    cap.innerHTML = `Original · <b>${fmtBytes(it.file.size)}</b>`;
    fig.append(media, cap);
    pair.append(fig);
  }
  const sk = document.createElement('figure');
  sk.innerHTML = '<div class="frame"><canvas width="4" height="3"></canvas><div class="busy" hidden></div></div><figcaption></figcaption>';
  pair.append(sk);
  el.append(pair);
  if (!received) {
    const meta = document.createElement('div');
    meta.className = 'meta';
    const name = document.createElement('span'); name.className = 'name'; name.textContent = it.file.name;
    const rm = document.createElement('button'); rm.textContent = 'Remove';
    rm.onclick = () => {
      clearInterval(it.timer); URL.revokeObjectURL(it.url); el.remove();
      items.splice(items.indexOf(it), 1); updateBudget();
      if (!items.length) $('#items').innerHTML = '<p class="empty">Add a photo of your pet, a food bowl, a door latch… and a short video.</p>';
    };
    meta.append(name, rm);
    el.append(meta);
  }
  list.append(el);
  it.el = el;
}

function setBusy(it, msg) {
  const b = $('.busy', it.el);
  if (!b) return;
  b.hidden = !msg; if (msg) b.textContent = msg;
}

function drawBits(canvas, bits, w, h) {
  if (canvas.width !== w || canvas.height !== h) { canvas.width = w; canvas.height = h; canvas._img = null; }
  const ctx = canvas.getContext('2d');
  const img = canvas._img || (canvas._img = ctx.createImageData(w, h));
  const d = img.data;
  for (let i = 0, j = 0; i < bits.length; i++, j += 4) {
    const c = bits[i] ? INK : PAPER;
    d[j] = c[0]; d[j + 1] = c[1]; d[j + 2] = c[2]; d[j + 3] = 255;
  }
  ctx.putImageData(img, 0, 0);
}

function renderSketch(it) {
  const canvas = $('canvas', it.el), cap = $('figcaption:last-of-type', $('.frame', it.el).parentNode);
  clearInterval(it.timer);
  if (it.err) { cap.innerHTML = ''; const s = document.createElement('span'); s.className = 'err'; s.textContent = it.err; cap.append(s); return; }
  const m = it.model, frame = $('.frame', it.el);
  let grid = $('.steps', frame);
  canvas.hidden = m.type === 3;
  if (m.type === 3) {
    if (!grid) { grid = document.createElement('div'); grid.className = 'steps'; frame.prepend(grid); }
    grid.innerHTML = '';
    m.frames.forEach((f, k) => {
      const cell = document.createElement('div'), c = document.createElement('canvas'), n = document.createElement('span');
      cell.className = 'step'; n.textContent = k + 1;
      cell.append(c, n); grid.append(cell);
      drawBits(c, f, m.w, m.h);
    });
  } else {
    grid?.remove();
    drawBits(canvas, m.frames[0], m.w, m.h);
  }
  if (m.type === 2 && m.frames.length > 1) {
    let k = 0;
    it.timer = setInterval(() => { k = (k + 1) % m.frames.length; drawBits(canvas, m.frames[k], m.w, m.h); }, 1000 / m.fps);
  }
  const chars = b64len(it.bytes.length);
  const dims = m.type === 3
    ? `${m.frames.length} step${m.frames.length === 1 ? '' : 's'} at ${m.w}×${m.h}` + (it.times ? ` · from ${it.times.map(t => t.toFixed(1) + 's').join(', ')}` : '')
    : `${m.w}×${m.h}` + (m.frames.length > 1 ? ` · ${m.frames.length} frames @ ${m.fps}fps` : '');
  cap.innerHTML = `Sketch · <b>${fmtChars(chars)} chars</b> in link · ${dims}` +
    (it.zip ? ` · zip-style would be ${fmtChars(it.zip)}` : '') +
    (it.exact === false ? ' · <span class="err">round-trip mismatch!</span>' : '');
}

function linkData() {
  const parts = items.filter(i => i.bytes).map(i => i.bytes);
  return parts.length ? toB64u(encodeContainer(parts)) : '';
}
const linkFor = data => location.href.split('#')[0] + '#' + data;

function updateBudget() {
  const data = linkData(), n = data.length, count = items.filter(i => i.bytes).length;
  $('#meterFill').style.width = Math.min(100, n / LINK_BUDGET * 100) + '%';
  const b = $('#budget');
  b.classList.toggle('warn', n > LINK_BUDGET * 0.8 && n <= LINK_BUDGET);
  b.classList.toggle('over', n > LINK_BUDGET);
  $('#budgetText').textContent = n
    ? `Link data: ${fmtChars(n)} of ${fmtChars(LINK_BUDGET)} characters · ${count} item${count === 1 ? '' : 's'}${n > LINK_BUDGET ? ' · too big for a chat message' : ''}`
    : 'Link: empty';
  $('#copyLink').disabled = $('#openLink').disabled = !n;
  $('#linkOut').hidden = true;
}

// ---------- Received view (opened from a link) ----------
let receivedItems = [];
function showFromHash() {
  receivedItems.forEach(r => clearInterval(r.timer));
  receivedItems = [];
  $('#receivedItems').innerHTML = '';
  const data = location.hash.slice(1);
  if (!data) { $('#received').hidden = true; $('#lab').hidden = false; return; }
  try {
    const models = decodeContainer(fromB64u(data)).filter(m => !m.unknown);
    for (const m of models) {
      const it = { model: m, bytes: { length: Math.floor(data.length * 3 / 4 / models.length) } };
      makeCard(it, true);
      renderSketch(it);
      const cap = $('figcaption', it.el);
      cap.innerHTML = m.type === 3 ? `Steps · ${m.frames.length} sketches` : `${m.type === 2 ? 'Flipbook' : 'Photo'} · ${m.w}×${m.h}` + (m.frames.length > 1 ? ` · ${m.frames.length} frames` : '');
      receivedItems.push(it);
    }
    $('#receivedText').textContent = `Opened from a link: ${models.length} sketch${models.length === 1 ? '' : 'es'} decoded from ${fmtChars(data.length)} characters. No server, no upload.`;
    $('#received').hidden = false; $('#lab').hidden = true;
  } catch (e) {
    toast("This link's data couldn't be read");
    $('#received').hidden = true; $('#lab').hidden = false;
  }
}

// ---------- Wiring ----------
for (const el of document.querySelectorAll('.ctl input[type=range]')) {
  const out = $('output', el.parentNode);
  const show = () => { if (out) out.textContent = el.value; };
  show();
  el.addEventListener('input', () => { show(); scheduleRerender(); });
}
for (const el of document.querySelectorAll('.ctl select, .ctl input[type=checkbox]')) el.addEventListener('change', scheduleRerender);

$('#file').addEventListener('change', e => { addFiles([...e.target.files]); e.target.value = ''; });
const drop = $('#drop');
['dragenter', 'dragover'].forEach(t => document.addEventListener(t, e => { e.preventDefault(); drop.classList.add('over'); }));
['dragleave', 'drop'].forEach(t => document.addEventListener(t, e => { e.preventDefault(); drop.classList.remove('over'); }));
document.addEventListener('drop', e => { if (e.dataTransfer?.files.length) addFiles([...e.dataTransfer.files]); });

$('#copyLink').onclick = async () => {
  const link = linkFor(linkData());
  try { await navigator.clipboard.writeText(link); toast(`Link copied (${fmtChars(link.length)} characters)`); }
  catch { const t = $('#linkOut'); t.value = link; t.hidden = false; t.select(); toast('Copy the link from the box'); }
};
$('#openLink').onclick = () => window.open(linkFor(linkData()), '_blank');
$('#backToLab').onclick = () => { history.replaceState(null, '', location.pathname + location.search); showFromHash(); };
window.addEventListener('hashchange', showFromHash);
showFromHash();
</script>
</body>
